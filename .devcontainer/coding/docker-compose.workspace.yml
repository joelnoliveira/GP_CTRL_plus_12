services:
  db:
    image: postgres:17
    container_name: postgres__db
    restart: always
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../../db/init/:/docker-entrypoint-initdb.d/:Z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ../../ollama/ollama_data:/root/.ollama:Z
    # gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== LANGFUSE (SIMPLIFIED) ====================
  langfuse-postgres:
    image: postgres:17
    container_name: langfuse_postgres
    restart: always
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_secret
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-web:
    image: langfuse/langfuse:2
    container_name: langfuse_web
    restart: always
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: langfuse_nextauth_secret_change_in_production
      DATABASE_URL: postgresql://langfuse:langfuse_secret@langfuse-postgres:5432/langfuse
      SALT: langfuse_salt_change_in_production
      ENCRYPTION_KEY: 772b6f852732e3ebbfb51fac76260039fea2a400aeb4750101d92416d7cc332d
      TELEMETRY_ENABLED: "false"

  backend:
    restart: unless-stopped
    build: ../../backend
    container_name: fast_api
    command: tail -f /dev/null
    user: root
    volumes:
      - ../../:/workspace:Z
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/status/alive/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # env_file:
    #   - ../.env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      langfuse-web:
        condition: service_started

  # fronted: #TODO

volumes:
  ollama_data:
    name: ollama_data
  postgres_data:
  langfuse_postgres_data:
