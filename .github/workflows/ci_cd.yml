name: CI

on:
  push:
    branches: ["main", "140-implementação-de-linters"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-ruff@v3
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend/react-app
      - run: npm run lint
        working-directory: frontend/react-app
