services:
  db:
    image: postgres:17
    container_name: postgres__db
    restart: always
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../db/init/:/docker-entrypoint-initdb.d/:Z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ../../ollama/ollama_data:/root/.ollama:Z
    # gpus: all
    restart: unless-stopped

  #langfuse: #TODO

  backend:
    restart: unless-stopped
    build: ../../backend
    container_name: fast_api
    command: tail -f /dev/null
    user: root
    volumes:
      - ../../:/workspace:Z
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/status/alive/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # env_file:
    #   - ../.env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  # fronted: #TODO

volumes:
  ollama_data:
    name: ollama_data
  postgres_data:
